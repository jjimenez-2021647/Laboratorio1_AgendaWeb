<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDaily - Perfil Usuario</title>
    <link rel="icon" type="image/x-icon" href="../Images/Icono - Login.png">
    <link rel="stylesheet" href="../Styles/perfilUsuario.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header class="header-principal">
        <div class="contenedor-header">
            <div class="logo">
                <h1>MyDaily</h1>
            </div>

            <nav class="navegacion">
                <a href="principal.html" class="nav-link">Inicio</a>
                <a href="principal.html#seccion-contactos" class="nav-link">Contactos</a>
                <a href="favoritos.html" class="nav-link">Favoritos</a>
                <a href="tareas.html" class="nav-link">Lista de Tareas</a>
                <a href="perfilUsuario.html" class="nav-link">Perfil</a>
            </nav>

            <div class="usuario-info">
                <span class="nombre-usuario" id="nombreUsuario">Usuario</span>
                <button class="btn-cerrar-sesion" onclick="cerrarSesion()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Cerrar Sesión
                </button>
            </div>
        </div>
    </header>

    <section>
        <div class="container">
            <div class="section">
                <h2>Perfil Usuario</h2>
                
                <form id="formContacto">
                    <input type="hidden" id="codigoContacto" name="codigoContacto">

                    <!-- Sección de imagen circular -->
                    <div class="seccion-imagen">
                        <div class="circulo-imagen">
                            <img id="preview-imagen" src="../Images/Perfil.jpg" alt="Foto contacto">
                        </div>
                        <div class="form-group-imagen">
                            <label for="imagenContacto" class="btn-seleccionar-imagen">
                                <i class="fa-solid fa-camera"></i>
                                Seleccionar Imagen
                            </label>
                            <input type="file" id="imagenContacto" name="imagenContacto" accept="image/*" style="display: none;">
                        </div>
                    </div>

                    <!-- Inputs del formulario -->
                    <div class="contenedor-inputs">
                        <div class="form-group">
                            <input type="text" class="entrada_texto" id="nombreContacto" name="nombreContacto" required>
                            <label class="label-input">Nombre</label>
                        </div>

                        <div class="form-group">
                            <input type="text" class="entrada_texto" id="apellidoContacto" name="apellidoContacto" required>
                            <label class="label-input">Apellido</label>
                        </div>

                        <div class="form-group">
                            <input type="tel" class="entrada_texto" id="telefonoContacto" name="telefonoContacto" required>
                            <label class="label-input">Teléfono</label>
                        </div>

                        <div class="form-group">
                            <input type="email" class="entrada_texto" id="correoContacto" name="correoContacto" required>
                            <label class="label-input">Correo Electrónico</label>
                        </div>
                        
                        <div class="form-group">
                            <input type="password" class="entrada_texto" id="passwordContacto" name="correoContacto" required>
                            <label class="label-input">Contraseña</label>
                        </div>

                        <div class="form-group">
                            <input type="text" class="entrada_texto" id="direccionContacto" name="direccionContacto" required>
                            <label class="label-input">Dirección</label>
                        </div>

                        <div class="form-group">
                            <label class="label-input-date">Fecha de Registro</label>
                            <input type="date" class="entrada_texto" id="fechaRegistro" name="fechaRegistro" required>
                        </div>
                    </div>

                    <!-- Botón centrado -->
                    <div class="contenedor-boton">
                        <button type="submit" class="btn_crear" id="btnCrear">
                            <span class="bnt_texto">Crear Contacto</span>
                            <span class="btn_icono">
                                <i class="fa-solid fa-user-plus"></i>
                            </span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer-principal">
        <div class="contenedor-footer">
            <p>&copy; 2026 MyDaily.</p>
            <p>Todos los derechos reservados.</p>
        </div>
    </footer>
    <script src="../Scripts/principal.js"></script>
    <script src="../Scripts/perfilUsuario.js"></script>
</body>

</html>
