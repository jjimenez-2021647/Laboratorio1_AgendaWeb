<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDaily - Login</title>
    <link rel="icon" type="image/x-icon" href="Images/Icono - Login.png">
    <link rel="stylesheet" href="./Styles/index.css">
</head>

<body>
    <div class="contenedor-login">
        <div class="login-izquierda">
            <h1>My Daily</h1>
            <div class="ilustracion-contactos">
                <img src="./Images/Icono - Login.png" alt="Ilustración MyDaily">
            </div>
            <p>Diseñada para organizar tu rutina diaria de manera simple y efectiva</p>
        </div>

        <div class="flip-card">
            <div class="flip-card-inner" id="flipCard">
                <div class="flip-card-front">
                    <div class="login-derecha">
                        <h2>Bienvenido</h2>
                        <p>Inicia sesión para continuar</p>

                        <form id="formularioLogin" action="tu-servlet-aqui" method="POST">
                            <div class="grupo-formulario">
                                <label for="correo">Correo electrónico:</label>
                                <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo" required>
                            </div>

                            <div class="grupo-formulario">
                                <label for="contrasena">Contraseña:</label>
                                <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña"
                                    required>
                            </div>

                            <div class="opciones-formulario">
                                <label class="recordarme">
                                    <input type="checkbox" id="recordar" name="recordar">
                                    <span>Recordarme</span>
                                </label>
                                <a href="#" class="olvido-contrasena">¿Olvidaste tu contraseña?</a>
                            </div>

                            <button type="submit" class="boton-login">Iniciar Sesión</button>
                        </form>

                        <div class="texto-registro">
                            ¿No tienes cuenta? <a href="#" id="btnRegistro">Regístrate aquí</a>
                        </div>
                    </div>
                </div>

                <div class="flip-card-back">
                    <div class="login-derecha">
                        <h2>Crea tu cuenta</h2>
                        <p>Regístrate para comenzar</p>

                        <form id="formularioRegistro" action="tu-servlet-registro" method="POST">
                            <div class="grupo-formulario">
                                <label for="correoRegistro">Correo electrónico:</label>
                                <input type="email" id="correoRegistro" name="correo" placeholder="Ingresa tu correo"
                                    required>
                            </div>

                            <div class="grupo-formulario">
                                <label for="contrasenaRegistro">Contraseña:</label>
                                <input type="password" id="contrasenaRegistro" name="contrasena" placeholder="Ingresa tu contraseña"
                                    required>
                            </div>

                            <div class="grupo-formulario">
                                <label for="confirmarContrasena">Confirma tu Contraseña:</label>
                                <input type="password" id="confirmarContrasena" name="confirmarContrasena" placeholder="Confirma tu contraseña" required>
                            </div>

                            <button type="submit" class="boton-login">Registrarse</button>
                        </form>

                        <div class="texto-registro">
                            ¿Ya tienes cuenta? <a href="#" id="btnLogin">Inicia sesión aquí</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="./Scripts/index.js"></script>
</body>

</html>
